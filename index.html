<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hundehygienebeutel</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      html,
      body,
      #map {
        height: 100%;
        margin: 0;
      }

      .location-image {
        display: block;
        max-width: 240px;
        max-height: 180px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div id="map" aria-label="Interactive map"></div>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      const map = L.map("map").setView([50.9, 11.0], 6);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      }).addTo(map);

      const imageExtensions = ["jpeg", "jpg", "png", "webp"];
      const imageSuffixes = ["", "-1", "-2", "-3"];

      function findLocationImages(locationId) {
        const candidates = imageSuffixes.flatMap((suffix) =>
          imageExtensions.map(
            (extension) => `./img/${locationId}${suffix}.${extension}`,
          ),
        );

        return Promise.all(
          candidates.map(
            (imagePath) =>
              new Promise((resolve) => {
                const image = new Image();
                image.onload = () => resolve(imagePath);
                image.onerror = () => resolve(null);
                image.src = imagePath;
              }),
          ),
        ).then((imagePaths) => imagePaths.filter(Boolean).slice(0, 3));
      }

      fetch("./loc.json")
        .then((response) => response.json())
        .then((locations) => {
          locations.forEach((location) => {
            findLocationImages(location.id).then((locationImages) => {
              const popupContent = [
                `<strong>Location ${location.id}</strong>`,
                ...locationImages.map(
                  (imagePath) =>
                    `<a href="${imagePath}" target="_blank" rel="noopener noreferrer"><img class="location-image" src="${imagePath}" alt="Location ${location.id}" /></a>`,
                ),
              ].join("");

              L.marker([location.latitude, location.longitude])
                .addTo(map)
                .bindPopup(popupContent);
            });
          });
        });
    </script>
  </body>
</html>
